name: Java assignment checks
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Assignment 1
        working-directory: Assignments/Assignment 1
        run: javac Main.java ParkingFacility.java VehicleFactory.java ParkingSystemTests.java
      - name: Run regression tests
        working-directory: Assignments/Assignment 1
        run: java ParkingSystemTests
      - name: Verify supplied FeeDemo output
        working-directory: Assignments/Assignment 1
        run: java Main fee-demo
