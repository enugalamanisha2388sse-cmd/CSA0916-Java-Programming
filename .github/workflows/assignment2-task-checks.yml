name: Assignment 2 Java Task Checks

on:
  push:
    branches: [ main ]
    paths:
      - 'Assignments/Assignment 2/**'
      - '.github/workflows/assignment2-task-checks.yml'
  workflow_dispatch:

jobs:
  compile-and-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [Task01, Task02, Task03, Task04, Task05, Task06, Task07]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and execute ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          cd "Assignments/Assignment 2/${{ matrix.task }}"
          javac Main.java
          java Main | tee "actual-output.txt"
      - name: Upload execution output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment2-${{ matrix.task }}-output
          path: 'Assignments/Assignment 2/${{ matrix.task }}/actual-output.txt'
          if-no-files-found: ignore
