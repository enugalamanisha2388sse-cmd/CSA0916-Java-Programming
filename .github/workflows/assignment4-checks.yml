name: Assignment 4 Java checks
on:
  push:
    paths:
      - 'Assignments/Assignment 4/**'
      - '.github/workflows/assignment4-checks.yml'
  workflow_dispatch:
jobs:
  compile-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile every task
        shell: bash
        run: |
          set -e
          for task in "Assignments/Assignment 4"/Task*; do
            echo "Compiling $task"
            mkdir -p "$RUNNER_TEMP/$(basename "$task")"
            javac -d "$RUNNER_TEMP/$(basename "$task")" "$task"/*.java
          done
      - name: Run non-GUI design summaries
        shell: bash
        run: |
          set -e
          for task in Task01 Task02; do
            java -cp "$RUNNER_TEMP/$task" Main | tee "$RUNNER_TEMP/$task-actual-output.txt"
          done
      - name: Upload console output
        uses: actions/upload-artifact@v4
        with:
          name: assignment4-console-output
          path: ${{ runner.temp }}/Task*-actual-output.txt
