name: Assignment 1 task compilation and output checks
on:
  push:
    branches: [ main ]
    paths:
      - 'Assignments/Assignment 1/**'
      - '.github/workflows/assignment1-task-checks.yml'
  pull_request:
    branches: [ main ]
jobs:
  compile-and-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: Task01
            main_class: Task01ProblemModel
          - task: Task02
            main_class: Task02DataRepresentation
          - task: Task03
            main_class: ParkingFacility
          - task: Task04
            main_class: Task04TicketConstructors
          - task: Task05
            main_class: Task05StaticLifecycle
          - task: Task06
            main_class: Task06Inheritance
          - task: Task07
            main_class: Task07Overriding
          - task: Task08
            main_class: FeeDemo
          - task: Task09
            main_class: Task09AbstractInterface
          - task: Task10
            main_class: Task10Encapsulation
          - task: Task11
            main_class: ParkingFacility
          - task: Task12
            main_class: Task12DesignChallenge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile task source
        shell: bash
        run: |
          cd "Assignments/Assignment 1/${{ matrix.task }}"
          javac *.java
      - name: Run task and capture console output
        shell: bash
        run: |
          cd "Assignments/Assignment 1/${{ matrix.task }}"
          java "${{ matrix.main_class }}" | tee actual-output.txt
      - name: Upload actual output artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.task }}-console-output
          path: Assignments/Assignment 1/${{ matrix.task }}/actual-output.txt
